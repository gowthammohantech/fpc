name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # The integration suites skip themselves without a database, which would
      # look like a pass. Giving CI a real MongoDB is what makes them run.
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGO_TEST_URI: mongodb://localhost:27017/fpc-ci
      # Exercises the flag parser that previously read "false" as true.
      JOBS_ENABLED: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Must precede typecheck and test: workspace packages resolve through
      # their built dist/, so a clean checkout fails without this.
      - name: Build workspace packages
        run: pnpm build

      - run: pnpm typecheck

      - run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Confirm integration tests ran rather than skipped
        # A silent skip is indistinguishable from a pass, so fail the job if
        # the database-backed suites did not actually execute.
        run: |
          output=$(pnpm --filter @fpc/server test 2>&1)
          echo "$output"
          if echo "$output" | grep -q "skipped — "; then
            echo "::error::Integration tests skipped; they must run against the MongoDB service."
            exit 1
          fi
