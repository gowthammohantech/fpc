services:
  mongo:
    image: mongo:7
    container_name: fpc-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - fpc-mongo-data:/data/db

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: fpc-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI — inspect outbound mail here
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  fpc-mongo-data:
